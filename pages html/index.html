<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jeu de football</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    <header class="flex  justify-between bg-slate-900 p-3 font">
        <div>
            <h1 class="  flex text-sky-50">
                <img class="size-6 font-bold" src="/img/football co.png" alt=""> TACHKILA
            </h1>
        </div>
        <nav>
            <ul class="flex gap-6 text-white border-slate-700 border bg-slate-800 border-xl rounded-xl p-4 ">
                <li><a href=" index.html">Effectif</a></li>
                <li><a href="composition.html">Composition</a></li>
                <li><a href="matchs.html">Matchs</a></li>

            </ul>
        </nav>

        </div>
        <ul class="flex gap-6 place-items-center">
            <div class="border border-indigo-600 rounded-[10vw] w-2 h-2 bg-orange-500 font-bold"></div>
            <li class=" text-orange-500 font-bold">GB</li>
            <div class="border border-indigo-600 rounded-[10vw] w-2 h-2 bg-blue-700 font-bold"></div>
            <li class="text-blue-700 font-bold">DEF </li>
            <div class="border border-indigo-600 rounded-[10vw] w-2 h-2 bg-green-600 font-bold"></div>
            <li class=" text-green-600 font-bold">MIL</li>
            <div class="border border-indigo-600 rounded-[10vw] w-2 h-2 bg-red-600 font-bold"></div>
            <li class=" text-red-600 font-bold">ATT</li>

        </ul>

    </header>



    <main class=" bg-slate-800 ">
        <section>
            <div class="flex  justify-between  ">
                <h1 class="font-bold text-white text-3xl p-4">Effectif</h1>
                <button id="btn" class="bg-green-600 text-white font-bold  mt-4 mb-6 p-4 rounded-xl p-3"> + Ajouter un
                    joueur</button>
            </div>
            <div class="flex gap-6 text-white border-slate-700 border bg-slate-800 border-xl rounded-xl p-4 " ">
                <input type=" search" id="searchInput" placeholder="Rechercher une joueur par nom ..."
                class=" flex w-full rounded-lg border border-slate-700 bg-slate-900 p-3 text-white outline-none focus:border-red-500" />

            <div class="  text-white w-64   flex gap-6  border-slate-900 border bg-slate-900 border-xl rounded-xl p-4 ">
                <a href=""> toute</a>
                <a href="" bg-slate-800> GB</a>
                <a href="">DEF</a>
                <a href="">MIL</a>
                <a href="">ATT</a>
            </div>
            </div>
        </section>
        <section class="bg-slate-800">
            <div class="formj flex flex-col mt-4 ">
                <p class="text-sm text-slate-400 font-normal mb-4 flex bg-slate-900 p-4
                  rounded-xl border border-slate-700 gap-3 haid"> Aucun joueur pour le moment</p>
            </div>
            <div id="popup-joueur"
                   class="w-[50%] rounded-2xl border border-slate-700 bg-slate-900 p-6 shadow-2xl">
                <div class="mb-6 flex items-center justify-between">
                    <h2 class="text-xl font-bold text-white">
                        Ajouter un joueur
                    </h2>

                    <button type="button" class="text-2xl text-slate-400 hover:text-white  btn-annuler">
                        &times;
                    </button>
                </div>

                <form id="form">
                    <div class="mb-4 ">
                        <label class="mb-2 block text-sm text-slate-300">
                            Nom complet
                        </label>

                        <input type="text" placeholder="Ex.bouchra ramzi" required
                            class="w-full rounded-lg border border-slate-700 bg-slate-800 p-3 text-white outline-none focus:border-green-500 nom ">
                        <p class="text-red mesageinvalidN"></p>
                    </div>
                    <div class="  grid grid-cols-2 grid-rows-2 gap-4">
                        
                            <label class="mb-2 block text-sm text-slate-300">
                                Numéro du maillot
                                <input type="number" placeholder="Ex. 10" required
                                class="w-full rounded-lg border border-slate-700 bg-slate-800 p-3 text-white outline-none focus:border-green-500 num">
                            <p class=" text-red invalidnumbr "></p>
                            </label>

                            
                        
                        
                            <label class="mb-2 block text-sm text-slate-300">
                                Poste
                                <select class="w-full rounded-lg border border-slate-700 bg-slate-800 p-3 text-white post">
                                <option value="GB">Gardien</option>
                                <option value="DEF">Défenseur</option>
                                <option value="MIL">Milieu</option>
                                <option value="ATT">Attaquant</option>
                            </select>
                            </label>
                            <label class="mb-2 block text-sm text-slate-300">
                                age :
                                <input type="number" required
                                class="w-full rounded-lg border border-slate-700 bg-slate-800 p-3 text-white outline-none focus:border-green-500 age">
                            <p class=" text-red invalidage "></p>
                            </label>  

                            <label class="mb-2 block text-sm text-slate-300">
                                statut
                                <select class="w-full rounded-lg border border-slate-700 bg-slate-800 p-3 text-white statut">
                                <option value="fr">en forme</option>
                                <option value="blesse">blessé</option>
                            </select>
                            </label>

                    </div>
                    <div class="flex gap-3">
                        <button type="button"
                            class="flex-1 rounded-lg bg-slate-700 p-3 font-semibold text-white hover:bg-slate-600 ">
                            Annuler
                        </button>

                        <button id="ajouterj"
                            class="flex-1 rounded-lg bg-green-600 p-3 font-semibold text-white hover:bg-green-500 ">
                            Ajouter
                        </button>
                    </div>
                </form>

            </div>

    </main>
    <script type="module" src="/pages js/page-effectif.js"></script>

</body>

</html>
